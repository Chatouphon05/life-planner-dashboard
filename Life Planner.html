<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Life Planner — Redesign</title>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { overscroll-behavior: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- starters -->
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- our system -->
<script type="text/babel" src="src/tokens.jsx"></script>
<script type="text/babel" src="src/sections.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "night",
  "heroVariant": "mantra",
  "density": "regular",
  "showDesktop": true
}/*EDITMODE-END*/;

function Root() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <React.Fragment>
      <DesignCanvas>

        <DCSection id="mobile" title="Mobile · iPhone"
          subtitle="Bullet-journal-inspired daily/weekly/monthly views — tap tabs, tasks, habits.">

          <DCArtboard id="m-daily" label="01 · Daily" width={440} height={920}
            style={{background: '#0d0d14', padding: '23px 19px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
            <MobileInFrame themeKey={t.theme} heroVariant={t.heroVariant}
              density={t.density} initialTab="Daily" />
          </DCArtboard>

          <DCArtboard id="m-weekly" label="02 · Weekly" width={440} height={920}
            style={{background: '#0d0d14', padding: '23px 19px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
            <MobileInFrame themeKey={t.theme} heroVariant={t.heroVariant}
              density={t.density} initialTab="Weekly" />
          </DCArtboard>

          <DCArtboard id="m-monthly" label="03 · Monthly" width={440} height={920}
            style={{background: '#0d0d14', padding: '23px 19px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
            <MobileInFrame themeKey={t.theme} heroVariant={t.heroVariant}
              density={t.density} initialTab="Monthly" />
          </DCArtboard>

          <DCArtboard id="m-capture" label="04 · Quick capture (BuJo log)" width={440} height={920}
            style={{background: '#0d0d14', padding: '23px 19px', display: 'flex', alignItems: 'center', justifyContent: 'center'}}>
            <MobileInFrame themeKey={t.theme} heroVariant={t.heroVariant}
              density={t.density} initialTab="Daily" initialModalOpen={true} />
          </DCArtboard>

        </DCSection>

        <DCSection id="desktop" title="Desktop · single-page spread"
          subtitle="Today, week, goals & habits — one screen, no scrolling on a 14-inch laptop.">

          <DCArtboard id="d-night" label="Desktop · Night" width={1280} height={820}
            style={{background: TOKENS.themes.night.bg}}>
            <DesktopApp themeKey={t.theme} />
          </DCArtboard>

        </DCSection>

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Palette" value={t.theme}
          options={['night', 'dawn', 'parchment']}
          onChange={(v) => setTweak('theme', v)} />

        <TweakSection label="Hero variant" />
        <TweakRadio label="Mobile hero" value={t.heroVariant}
          options={['mantra', 'countdown']}
          onChange={(v) => setTweak('heroVariant', v)} />

        <TweakSection label="Mobile density" />
        <TweakRadio label="Density" value={t.density}
          options={['compact', 'regular', 'spacious']}
          onChange={(v) => setTweak('density', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
